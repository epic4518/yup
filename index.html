<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Added your background image here */
            background-image: url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9); /* Slightly transparent white */
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 400px;
            z-index: 1;
            backdrop-filter: blur(5px); /* Blurs the background behind the card */
        }

        h1 { color: #333; margin-bottom: 1rem; }

        #message {
            display: none;
            font-size: 1.2rem;
            color: #e91e63;
            line-height: 1.6;
            margin-top: 20px;
            animation: fadeIn 2s;
        }

        button {
            background-color: #ff4081;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover {
            background-color: #f50057;
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <audio id="wishMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div class="container">
        <h1 id="title">Special message for you...</h1>
        <button id="revealBtn" onclick="revealWish()">Click to Open</button>
        <div id="message">
            <h2>✨ Happy Birthday BHAWNA ! ✨</h2>
            <p>I hope your day is as wonderful and unique as you are. Cheers to another amazing year✨!</p>
        </div>
    </div>

    <script>
        function revealWish() {
            // Play the music
            var music = document.getElementById('wishMusic');
            music.play();

            // Reveal the content
            document.getElementById('revealBtn').style.display = 'none';
            document.getElementById('title').innerText = "Surprise!";
            document.getElementById('message').style.display = 'block';
        }
    </script>
</body>
</html>
